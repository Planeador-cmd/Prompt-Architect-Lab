<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Laboratorio de Ingeniería de Prompts | Architect v4.0.0</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            slate: { 850: '#151e2e', 900: '#0f172a', 950: '#020617' },
            cyan: { 400: '#22d3ee', 500: '#06b6d4', 900: '#083344' },
            violet: { 500: '#8b5cf6', 900: '#4c1d95' },
            emerald: { 400: '#34d399', 900: '#064e3b' },
            amber: { 400: '#fbbf24', 900: '#78350f' }
          },
          animation: {
            'slide-in': 'slideIn 0.3s ease-out forwards',
            'fade-out': 'fadeOut 0.3s ease-in forwards'
          },
          keyframes: {
            slideIn: { '0%': { transform: 'translateY(100%)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } },
            fadeOut: { '0%': { opacity: '1' }, '100%': { opacity: '0' } }
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: Inter, system-ui, sans-serif; }
    .input-field {
      width: 100%; background-color: #1e293b; border: 1px solid #334155;
      color: #e2e8f0; padding: 0.75rem; border-radius: 0.375rem; transition: all 0.2s;
    }
    .input-field:focus { outline: none; border-color: #22d3ee; box-shadow: 0 0 0 1px #22d3ee; }
    .output-area { background-color: #020617; border: 1px solid #1e293b; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .prose table { width: 100%; text-align: left; border-collapse: collapse; font-size: 0.75rem; }
    .prose th { color: #94a3b8; font-weight: 600; padding: 0.25rem; border-bottom: 1px solid #334155; }
    .prose td { padding: 0.25rem; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen flex flex-col overflow-hidden">
<header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center gap-3">
    <div class="flex items-center gap-3">
      <i data-lucide="flask-conical" class="text-cyan-400 w-6 h-6"></i>
      <h1 class="text-xl font-bold tracking-tight text-slate-100 uppercase">Prompt <span class="text-cyan-400">Architect</span> Lab</h1>
    </div>
    <div class="flex items-center gap-3">
      <div id="tokenCount" class="text-[10px] font-mono text-slate-500">0 chars</div>
      <div id="modelBadge" class="text-[10px] font-mono bg-cyan-900/30 text-cyan-400 border border-cyan-800 px-2 py-1 rounded flex items-center gap-2"></div>
    </div>
  </div>
</header>

<main class="flex-1 max-w-7xl mx-auto w-full p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 overflow-hidden h-full">
  <div class="lg:col-span-5 space-y-5 overflow-y-auto pr-2 h-[calc(100vh-140px)] pb-10">
    <section class="bg-slate-900 p-5 rounded-lg border border-slate-800 shadow-lg space-y-4">
      <label class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest block">Arquitectura Cognitiva</label>
      <select id="frameworkSelect" class="input-field cursor-pointer text-sm font-mono" aria-label="Selector de framework"></select>
      <p id="frameworkDesc" class="text-xs text-slate-500 italic"></p>
      <label class="text-[10px] text-slate-500 font-bold uppercase mb-1 block">API Key de Gemini (solo local)</label>
      <input id="apiKeyInput" type="password" class="input-field text-sm" placeholder="AIza..." autocomplete="off" />
      <button id="btnRefine" class="w-full py-2 bg-violet-900/20 hover:bg-violet-900/40 text-violet-400 text-xs rounded border border-violet-800 transition flex items-center justify-center gap-2">
        <i data-lucide="sparkles" class="w-3 h-3"></i><span>Estructurar Inputs (ES)</span>
      </button>
    </section>

    <section class="space-y-4" id="inputsPanel"></section>
  </div>

  <div class="lg:col-span-7 flex flex-col h-[calc(100vh-140px)] gap-4">
    <div class="flex justify-between items-center">
      <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest flex items-center gap-2"><i data-lucide="code" class="w-3 h-3 text-cyan-400"></i>Prompt Generado</h2>
      <div class="flex gap-2">
        <button id="btnClear" class="p-1.5 text-slate-500 hover:text-red-400 transition" title="Limpiar todo"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
        <button id="btnCopy" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 px-4 py-1.5 rounded text-xs font-bold transition">Copiar</button>
      </div>
    </div>

    <div class="flex-1 min-h-0 flex flex-col gap-4">
      <div class="relative h-1/2 flex flex-col">
        <textarea id="outputPrompt" class="output-area w-full flex-1 p-6 text-sm text-slate-300 resize-none focus:outline-none rounded-lg border border-slate-800" placeholder="El prompt generado aparecerá aquí..."></textarea>
        <div class="bg-slate-900 border border-slate-800 rounded-lg p-2 flex flex-wrap gap-2 justify-end items-center mt-2">
          <button id="btnOptimize" class="text-[10px] px-3 py-1.5 bg-emerald-900/20 text-emerald-400 rounded border border-emerald-800/30">Mejorar</button>
          <button id="btnTranslate" class="text-[10px] px-3 py-1.5 bg-amber-900/20 text-amber-400 rounded border border-amber-800/30">Traducir</button>
          <button id="btnRevert" class="text-[10px] px-3 py-1.5 bg-slate-800 text-slate-300 rounded border border-slate-700">Revertir</button>
          <button id="btnFinal" class="text-[10px] px-3 py-1.5 bg-indigo-600 text-white rounded border border-indigo-500/50">Trad. Final (EN)</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4 h-1/2">
        <section class="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col overflow-hidden relative">
          <div class="flex justify-between items-center mb-2">
            <h3 class="text-[10px] font-bold text-violet-400 uppercase">LLM Judge</h3>
            <button id="btnEvaluate" class="text-[9px] bg-violet-500/10 text-violet-400 px-2 py-1 rounded border border-violet-800">Evaluar</button>
          </div>
          <div id="evalOutput" class="text-xs text-slate-300 overflow-y-auto prose prose-invert max-w-none prose-sm"></div>
          <div id="loadingEval" class="absolute inset-0 bg-slate-950/90 hidden items-center justify-center text-violet-400 text-[10px] font-mono">ANALIZANDO...</div>
        </section>

        <section class="bg-slate-900 border border-slate-800 rounded-lg p-4 flex flex-col overflow-hidden relative">
          <div class="flex justify-between items-center mb-2">
            <h3 class="text-[10px] font-bold text-cyan-400 uppercase">Simulator</h3>
            <button id="btnTest" class="text-[9px] bg-cyan-500/10 text-cyan-400 px-2 py-1 rounded border border-cyan-800">Probar Prompt</button>
          </div>
          <div id="testOutput" class="text-xs text-slate-300 overflow-y-auto prose prose-invert max-w-none prose-sm"></div>
          <div id="loadingTest" class="absolute inset-0 bg-slate-950/90 hidden items-center justify-center text-cyan-400 text-[10px] font-mono">SIMULANDO...</div>
        </section>
      </div>
    </div>
  </div>
</main>

<div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

<script>
  const CURRENT_MODEL = 'gemini-2.5-flash';
  const API_VERSION = 'v1beta';

  const frameworkOptions = [
    { value: 'robust', label: 'Estándar Robusto (Prompt Base)', desc: 'Equilibrio ideal para prompts generales.' },
    { value: 'anthropic', label: 'Anthropic System (XML Tags)', desc: 'Útil para estructura por etiquetas.' },
    { value: 'risen', label: 'R.I.S.E.N. (Lógica de Pasos)', desc: 'Divide el trabajo en pasos explícitos.' },
    { value: 'care', label: 'C.A.R.E. (Copywriting/Resultados)', desc: 'Orientado a acciones con foco en resultado.' },
    { value: 'cot', label: 'Chain of Thought (Razonamiento)', desc: 'Fuerza razonamiento paso a paso.' }
  ];

  const fields = [
    { id: 'inputRole', key: 'role', label: 'Rol (Role)', type: 'input', placeholder: 'Ej: Ingeniero de Datos Senior...' },
    { id: 'inputTask', key: 'task', label: 'Objetivo (Task)', type: 'textarea', rows: 3, placeholder: 'Ej: Analizar este texto y resumir hallazgos...' },
    { id: 'inputContext', key: 'context', label: 'Contexto (Context)', type: 'textarea', rows: 3, placeholder: 'Pega aquí los datos crudos...' },
    { id: 'inputAudience', key: 'audience', label: 'Audiencia (Audience)', type: 'input', placeholder: 'Ej: Ejecutivos Nivel C...' },
    { id: 'inputExamples', key: 'examples', label: 'Ejemplos (Few-Shot)', type: 'textarea', rows: 3, placeholder: 'Usuario: [Entrada]\nAsistente: [Salida ideal]' },
    { id: 'inputConstraints', key: 'constraints', label: 'Restricciones (Constraints)', type: 'textarea', rows: 2, placeholder: 'Sin jerga técnica, máximo 200 palabras...' },
    { id: 'inputFormat', key: 'format', label: 'Formato (Format)', type: 'input', placeholder: 'Ej: Tabla Markdown, JSON...' }
  ];

  const elements = {};

  function el(id) { return document.getElementById(id); }

  function bootstrapUI() {
    const select = el('frameworkSelect');
    frameworkOptions.forEach((f) => {
      const option = document.createElement('option');
      option.value = f.value;
      option.textContent = f.label;
      select.appendChild(option);
    });

    const panel = el('inputsPanel');
    fields.forEach((f) => {
      const wrapper = document.createElement('div');
      const label = document.createElement('label');
      label.className = 'text-[10px] text-slate-500 font-bold uppercase mb-1 block';
      label.textContent = f.label;
      label.htmlFor = f.id;
      wrapper.appendChild(label);
      const input = document.createElement(f.type === 'textarea' ? 'textarea' : 'input');
      input.id = f.id;
      input.className = 'input-field text-sm';
      input.placeholder = f.placeholder;
      if (f.type === 'textarea') input.rows = f.rows;
      panel.appendChild(wrapper);
      wrapper.appendChild(input);
      elements[f.key] = input;
    });

    elements.framework = select;
    elements.desc = el('frameworkDesc');
    elements.output = el('outputPrompt');
    elements.tokenCount = el('tokenCount');
    elements.apiKey = el('apiKeyInput');

    el('modelBadge').innerHTML = `<span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>MODEL: ${CURRENT_MODEL}`;

    resetPanels();
    wireEvents();
    updateFrameworkDescription();
    lucide.createIcons();
  }

  function wireEvents() {
    elements.framework.addEventListener('change', updateFrameworkDescription);
    [...Object.values(elements).filter(Boolean)].forEach((e) => {
      if (e instanceof HTMLElement && ['INPUT', 'TEXTAREA'].includes(e.tagName) && e.id !== 'apiKeyInput') {
        e.addEventListener('input', generatePrompt);
      }
    });

    elements.output.addEventListener('input', (e) => updateTokenCount(e.target.value));
    el('btnCopy').addEventListener('click', copyToClipboard);
    el('btnClear').addEventListener('click', clearAll);
    el('btnRefine').addEventListener('click', aiRefineInputs);
    el('btnOptimize').addEventListener('click', () => runTransform('Mejorando...', 'Expert Editor. Improve clarity and flow, keep the SAME language. Return ONLY prompt.'));
    el('btnTranslate').addEventListener('click', () => runTransform('Traduciendo...', 'Translate to technical English preserving structure. Return ONLY text.'));
    el('btnRevert').addEventListener('click', () => runTransform('Revirtiendo...', 'Translate this prompt back to Spanish preserving structure. Return ONLY text.'));
    el('btnFinal').addEventListener('click', optimizeAndTranslate);
    el('btnEvaluate').addEventListener('click', evaluatePrompt);
    el('btnTest').addEventListener('click', testPrompt);
  }

  function updateFrameworkDescription() {
    const fw = frameworkOptions.find((f) => f.value === elements.framework.value);
    elements.desc.textContent = fw?.desc ?? '';
    generatePrompt();
  }

  function buildPrompt(data, fw) {
    let p = '';
    if (fw === 'robust') {
      if (data.role) p += `### ROLE\n${data.role}\n\n`;
      if (data.context) p += `### CONTEXT\n${data.context}\n\n`;
      if (data.examples) p += `### EXAMPLES (FEW-SHOT)\n${data.examples}\n\n`;
      if (data.task) p += `### GOAL/TASK\n${data.task}\n\n`;
      if (data.audience) p += `### AUDIENCE\n${data.audience}\n\n`;
      if (data.constraints) p += `### CONSTRAINTS\n${data.constraints}\n\n`;
      if (data.format) p += `### OUTPUT FORMAT\n${data.format}`;
    } else if (fw === 'anthropic') {
      if (data.role) p += `System Role: ${data.role}\n\n`;
      p += `<context>\n${data.context || 'N/A'}\n</context>\n\n`;
      if (data.examples) p += `<examples>\n${data.examples}\n</examples>\n\n`;
      p += `<task>\n${data.task || 'N/A'}\n</task>\n\n`;
      if (data.constraints) p += `<constraints>\n${data.constraints}\n</constraints>\n\n`;
      if (data.format) p += `<output_format>\n${data.format}\n</output_format>`;
    } else if (fw === 'risen') {
      p += `**Role:** ${data.role || 'Expert AI'}\n\n**Instructions:** ${data.task || 'N/A'}\n`;
      if (data.context) p += `\n(Context: ${data.context})\n`;
      p += `\n**Steps:**\n1. Analyze request.\n2. Review examples.\n3. Build result.\n\n`;
      if (data.examples) p += `**Examples:**\n${data.examples}\n\n`;
      p += `**Audience:** ${data.audience || 'General'}\n**Constraints:** ${data.constraints || 'None'}\n`;
      if (data.format) p += `**Format:** ${data.format}`;
    } else if (fw === 'care') {
      p += `1. **CONTEXT**: ${data.context || 'N/A'}\n2. **ACTION**: ${data.task || 'N/A'} (Role: ${data.role || 'N/A'})\n3. **RESULT**: Tailored for ${data.audience || 'General'}. Constraints: ${data.constraints || 'None'}\n4. **EXAMPLE/FORMAT**: ${data.examples || data.format || 'N/A'}`;
    } else {
      p += `Request: ${data.task || 'N/A'}\nContext: ${data.context || 'N/A'}\nRole: ${data.role || 'N/A'}\n`;
      if (data.examples) p += `\nExamples:\n${data.examples}\n`;
      p += `\nInstructions:\nLet's think step by step.\n1. Analyze constraints: ${data.constraints || 'None'}.\n2. Define format: ${data.format || 'Flexible'}.\n3. Generate response.`;
    }

    p += '\n\n***\nREQUIREMENT: Answer with epistemological rigor: distinguish facts, inferences, and debates; prioritize evidence; point out limits; and verify exhaustiveness.\n***\n\n***\nIMPORTANT: OUTPUT MUST BE IN SPANISH (ESPAÑOL).\n***';
    return p.trim();
  }

  function generatePrompt() {
    const data = {
      role: elements.role.value.trim(),
      task: elements.task.value.trim(),
      context: elements.context.value.trim(),
      audience: elements.audience.value.trim(),
      examples: elements.examples.value.trim(),
      constraints: elements.constraints.value.trim(),
      format: elements.format.value.trim()
    };

    elements.output.value = buildPrompt(data, elements.framework.value);
    updateTokenCount(elements.output.value);
  }

  function updateTokenCount(text) {
    const chars = text.length;
    const tokens = Math.ceil(chars / 4);
    elements.tokenCount.textContent = `${chars} chars (~${tokens} tokens)`;
  }

  function showToast(message, type = 'info') {
    const container = el('toastContainer');
    const toast = document.createElement('div');
    const colors = type === 'error' ? 'border-red-500 text-red-400' : type === 'success' ? 'border-emerald-500 text-emerald-400' : 'border-cyan-500 text-cyan-400';
    toast.className = `bg-slate-900/90 backdrop-blur border-l-4 ${colors} p-3 rounded shadow-2xl flex items-center gap-2 min-w-[260px] animate-slide-in`;
    toast.innerHTML = `<span class="text-xs font-semibold">${message}</span>`;
    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.add('animate-fade-out');
      setTimeout(() => toast.remove(), 300);
    }, 3000);
  }

  async function callGemini(userText, systemText) {
    const apiKey = elements.apiKey.value.trim();
    if (!apiKey) {
      showToast('Falta API Key para usar funciones IA.', 'error');
      return null;
    }

    const url = `https://generativelanguage.googleapis.com/${API_VERSION}/models/${CURRENT_MODEL}:generateContent?key=${apiKey}`;
    const payload = {
      contents: [{ parts: [{ text: userText }] }],
      systemInstruction: { parts: [{ text: systemText }] }
    };

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!response.ok) {
        const errorText = await response.text();
        throw new Error(`HTTP ${response.status}: ${errorText.slice(0, 200)}`);
      }
      const data = await response.json();
      if (data.error) throw new Error(data.error.message);
      return data.candidates?.[0]?.content?.parts?.[0]?.text ?? null;
    } catch (error) {
      console.error(error);
      showToast(`Error API: ${error.message}`, 'error');
      return null;
    }
  }

  async function runTransform(label, systemPrompt) {
    if (elements.output.value.trim().length < 10) {
      showToast('Genera un prompt primero.', 'error');
      return;
    }
    showToast(label, 'info');
    const result = await callGemini(elements.output.value, systemPrompt);
    if (result) {
      elements.output.value = result;
      updateTokenCount(result);
      showToast('Listo.', 'success');
    }
  }

  async function aiRefineInputs() {
    const raw = `${elements.task.value} ${elements.context.value}`.trim();
    if (raw.length < 5 && !elements.role.value.trim()) {
      showToast('Ingresa datos en Objetivo o Contexto para analizar.', 'error');
      return;
    }

    const button = el('btnRefine');
    button.disabled = true;
    const original = button.textContent;
    button.textContent = 'Estructurando...';

    const response = await callGemini(
      `Structure this input:\nRole: ${elements.role.value}\nInput: ${raw}`,
      "You are an Expert Prompt Architect. Return ONLY strict JSON with keys: role, task, context, audience, examples, constraints, format. Keep original language."
    );

    button.disabled = false;
    button.textContent = original;

    if (!response) return;
    try {
      const parsed = JSON.parse(response.replace(/```json|```/g, '').trim());
      fields.forEach((f) => {
        if (typeof parsed[f.key] === 'string') elements[f.key].value = parsed[f.key];
      });
      generatePrompt();
      showToast('Inputs estructurados correctamente.', 'success');
    } catch {
      showToast('La IA no devolvió JSON válido.', 'error');
    }
  }

  async function optimizeAndTranslate() {
    await runTransform(
      'Aplicando optimización final...',
      "1) Translate to professional ENGLISH. 2) Optimize clarity and imperative style. 3) Include instruction about epistemological rigor. 4) Ensure 'OUTPUT MUST BE IN SPANISH' appears at the end. Return ONLY final prompt."
    );
  }

  function renderMarkdownSafe(targetId, markdownText) {
    const raw = marked.parse(markdownText || '');
    el(targetId).innerHTML = DOMPurify.sanitize(raw);
  }

  async function evaluatePrompt() {
    const prompt = elements.output.value.trim();
    if (!prompt) return showToast('Genera un prompt primero.', 'error');
    el('loadingEval').classList.remove('hidden');
    el('loadingEval').classList.add('flex');
    const res = await callGemini(prompt, 'Act as a Prompt Judge. Score 0-100 for Clarity, Logic, Robustness. Return concise Markdown table + summary.');
    el('loadingEval').classList.add('hidden');
    el('loadingEval').classList.remove('flex');
    if (res) renderMarkdownSafe('evalOutput', res);
  }

  async function testPrompt() {
    const prompt = elements.output.value.trim();
    if (!prompt) return showToast('Genera un prompt primero.', 'error');
    el('loadingTest').classList.remove('hidden');
    el('loadingTest').classList.add('flex');
    const res = await callGemini(prompt, 'You are a helpful AI. Execute this prompt precisely.');
    el('loadingTest').classList.add('hidden');
    el('loadingTest').classList.remove('flex');
    if (res) renderMarkdownSafe('testOutput', res);
  }

  async function copyToClipboard() {
    if (!elements.output.value.trim()) return;
    try {
      await navigator.clipboard.writeText(elements.output.value);
      showToast('Copiado al portapapeles.', 'success');
    } catch {
      showToast('No se pudo copiar.', 'error');
    }
  }

  function resetPanels() {
    renderMarkdownSafe('evalOutput', '**¿Para qué sirve?**\n\nEvalúa claridad, lógica y robustez del prompt.');
    renderMarkdownSafe('testOutput', '**Resultado esperado:**\n\nEl simulador ejecutará el prompt con salida en español.');
  }

  function clearAll() {
    fields.forEach((f) => { elements[f.key].value = ''; });
    generatePrompt();
    resetPanels();
    showToast('Laboratorio reiniciado.', 'info');
  }

  bootstrapUI();
</script>
</body>
</html>
